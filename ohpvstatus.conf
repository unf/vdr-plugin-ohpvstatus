#
# ohpvstatus VDR plugin arguments
#
# Connection:
#   -H, --host=HOST           openHAB hostname or IP (default: 127.0.0.1)
#   -P, --port=PORT           openHAB port (default: 8080)
#       --ssl                 Use HTTPS instead of HTTP
#       --ssl-verify=no       Disable SSL certificate verification (self-signed)
#
# Items (always required):
#       --pv=ITEM             PV power item (default: PVPower)
#       --house=ITEM          House power item (default: HousePower)
#       --soc=ITEM            Battery SoC item (default: BatterySoC)
#
# Grid (choose one):
#       --grid=ITEM           Single item, positive=import negative=export
#       --grid-in=ITEM        Grid import item (always positive)
#       --grid-out=ITEM       Grid export item (always positive)
#
# Battery (choose one):
#       --battery=ITEM        Single item, positive=charge negative=discharge
#       --bat-in=ITEM         Battery charging item (always positive)
#       --bat-out=ITEM        Battery discharging item (always positive)
#
[ohpvstatus]
-H 127.0.0.1
-P 8080
#--ssl
#--ssl-verify=no
#--pv=PVPower
#--house=HousePower
#--soc=BatterySoC
#--grid=GridPower
#--battery=BatteryPower
