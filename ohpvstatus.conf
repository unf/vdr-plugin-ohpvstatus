#
# ohpvstatus VDR plugin arguments, see /usr/share/doc/vdr-plugin-ohpvstatus/README
#
# Connection:
#   -H, --host=HOST           openHAB hostname or IP (default: 127.0.0.1)
#   -P, --port=PORT           openHAB port (default: 8080)
#       --ssl                 use HTTPS instead of HTTP
#       --ssl-verify=no       do not verify the SSL certificate (self-signed)
#       --token=TOKEN         openHAB API token, only if openHAB requires one
#                             (this file is readable by every user)
#
# Items (defaults in brackets):
#       --pv=ITEM             PV power (PVPower)
#       --house=ITEM          house power (HousePower)
#       --soc=ITEM            battery state of charge in % (BatterySoC),
#                             --soc= without item hides the line
#
# Grid (choose one):
#       --grid=ITEM           single item, positive = import, negative = export (GridPower)
#       --grid-in=ITEM        grid import item (always positive), together with
#       --grid-out=ITEM       grid export item (always positive)
#
# Battery (choose one):
#       --battery=ITEM        single item, positive = charging, negative = discharging (BatteryPower)
#       --bat-in=ITEM         battery charging item (always positive), together with
#       --bat-out=ITEM        battery discharging item (always positive)
#
# Optional lines, only shown if an item is given:
#       --pv-today=ITEM       PV energy of today (Wh, kWh)
#       --line1=ITEM          free line 1, any item (number or text)
#       --label1=TEXT         its label (default: item name), with spaces in quotes:
#                             --label1="Autarky today"
#       --decimals1=N         decimals of a number, 0-3 (default: 1)
#       --line2..4  --label2..4  --decimals2..4     free lines 2 to 4
#
# Update interval, unit and invert switches are set in the VDR setup menu.
#
[ohpvstatus]
-H 127.0.0.1
-P 8080
#--ssl
#--ssl-verify=no
#--token=oh.vdr.xxxxxxxx
#--pv=PVPower
#--house=HousePower
#--soc=BatterySoC
#--grid=GridPower
#--battery=BatteryPower
#--pv-today=PVEnergyToday
#--line1=AutarkyToday
#--label1="Autarky today"
